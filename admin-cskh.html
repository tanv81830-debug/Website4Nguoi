<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSKH Admin - B3</title><link rel="stylesheet" href="style.css"><style>
.cskh{max-width:1100px;margin:25px auto;padding:0 18px;display:grid;grid-template-columns:280px 1fr;gap:18px}.panelx{background:#fff;border:1px solid #e5e7eb;border-radius:16px;overflow:hidden}.panelx h2{padding:18px;margin:0;border-bottom:1px solid #eee}.people button{width:100%;border:0;background:#fff;text-align:left;padding:13px 16px;border-bottom:1px solid #f0f1f3;cursor:pointer}.people button.active{background:#eef4ff}.chatbox{height:600px;display:flex;flex-direction:column}.chatmsgs{flex:1;overflow:auto;padding:18px;background:#f7f9fb}.bubble{max-width:75%;padding:10px 13px;border-radius:13px;background:#fff;margin:8px 0}.bubble.mine{margin-left:auto;background:#dbeafe}.compose{display:flex;padding:12px;border-top:1px solid #eee;gap:8px}.compose input{flex:1;padding:11px;border:1px solid #d7dce2;border-radius:9px}
@media(max-width:760px){.cskh{grid-template-columns:1fr}.chatbox{height:520px}}
</style></head><body><nav class="nav"><a class="brand" href="index.html">🪷 B3 ADMIN</a><div class="nav-links"><a href="admin-members.html">42 hồ sơ</a><a href="duyet.html">Duyệt ảnh</a><a href="quanly.html">Quản lý</a></div></nav>
<main class="cskh"><section class="panelx"><h2>CSKH</h2><div id="people" class="people"></div></section><section class="panelx chatbox"><div id="title" style="padding:18px;font-weight:700;border-bottom:1px solid #eee">Chọn thành viên</div><div id="chatmsgs" class="chatmsgs"></div><div class="compose"><input id="text" placeholder="Trả lời thành viên..."><button id="send" class="btn primary">Gửi</button></div></section></main>
<script type="module">
import {watchAuth,getProfile,watchMembers,watchConversation,sendMessage} from "./app.js";
let me, selected=null, stop=()=>{};
watchAuth(async u=>{if(!u)return location.href="login.html";me=await getProfile(u.uid);if(!me||!["admin","superadmin"].includes(me.role))return location.href="index.html";
watchMembers(items=>{const members=items.filter(x=>x.role==="member").slice(0,42);people.innerHTML=members.map(m=>`<button data-uid="${m.uid||m.id}">${m.name||m.email||m.uid}</button>`).join("");document.querySelectorAll("#people button").forEach(b=>b.onclick=()=>open(b.dataset.uid,b.textContent));});});
function open(uid,name){selected=uid;title.textContent="CSKH · "+name;document.querySelectorAll("#people button").forEach(b=>b.classList.toggle("active",b.dataset.uid===uid));stop();stop=watchConversation(uid,ms=>{chatmsgs.innerHTML=ms.map(m=>`<div class="bubble ${m.senderUid===me.uid?"mine":""}">${m.text}</div>`).join("");chatmsgs.scrollTop=chatmsgs.scrollHeight});}
send.onclick=async()=>{if(!selected||!text.value.trim())return;await sendMessage(selected,text.value);text.value="";};
text.onkeydown=e=>{if(e.key==="Enter")send.click()};
</script></body></html>
