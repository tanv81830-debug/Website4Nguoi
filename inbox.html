<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inbox - B3</title><link rel="stylesheet" href="style.css"></head><body><nav class="site-nav"><a class="brand" href="index.html">🪷 <span>B3</span></a><div class="nav-links"><a href="index.html">Trang chủ</a><a href="hs.html">Hồ sơ</a><a href="live.html">LIVE</a><a class="active" href="inbox.html">Inbox</a><a href="quanly.html">Quản lý</a></div></nav><main class="content-wrap"><section class="panel"><div class="panel-head"><div><span class="eyebrow">KHU VỰC THÀNH VIÊN</span><h1>Inbox</h1></div><div id="who" class="pill">Đang xác thực...</div></div><p class="muted">Nhắn tin realtime giữa các tài khoản B3. Người nhận cần cung cấp UID tài khoản.</p><div class="inbox-controls"><input id="toUid" placeholder="UID người nhận"><button id="openChat" class="btn primary">Mở chat</button></div><div id="chat" class="chat-window"></div><div class="inbox-compose"><input id="text" placeholder="Viết tin nhắn..." disabled><button id="send" class="btn primary" disabled>Gửi</button></div><p id="msg" class="form-msg"></p></section></main><script type="module">import {watchAuth,watchConversation,sendMessage} from './app.js';let me=null,stop=()=>{};watchAuth(u=>{if(!u){location.href='login.html';return;}me=u;who.textContent=u.displayName||u.email;});openChat.onclick=()=>{stop();const uid=toUid.value.trim();if(!uid)return;text.disabled=false;send.disabled=false;stop=watchConversation(uid,ms=>{chat.innerHTML=ms.map(m=>`<div class="bubble ${m.senderUid===me?.uid?'mine':''}">${m.text}</div>`).join('');chat.scrollTop=chat.scrollHeight})};send.onclick=async()=>{try{await sendMessage(toUid.value,text.value);text.value=''}catch(e){msg.textContent=e.message}};</script><script type="module" src="cskh-widget.js"></script></body></html>
