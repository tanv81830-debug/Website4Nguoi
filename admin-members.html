<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý 42 hồ sơ - B3 Admin</title><link rel="stylesheet" href="style.css"><style>
.members-admin{max-width:1100px;margin:30px auto;padding:0 18px}.member-admin-card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;display:grid;grid-template-columns:70px 1fr auto;gap:16px;align-items:center;margin:10px 0}.member-admin-card img{width:70px;height:70px;border-radius:12px;object-fit:cover;background:#eef2f7}.member-admin-card input{display:none}.member-admin-card .btn{white-space:nowrap}
</style></head><body><nav class="nav"><a class="brand" href="index.html">🪷 B3 ADMIN</a><div class="nav-links"><a href="duyet.html">Duyệt ảnh</a><a href="admin-cskh.html">CSKH</a><a href="quanly.html">Quản lý</a></div></nav>
<main class="members-admin"><span class="eyebrow">MEMBER CONTROL</span><h1>42 hồ sơ thành viên</h1><p class="muted">Mỗi hồ sơ vẫn là một hồ sơ riêng. Admin có thể thay ảnh trực tiếp tại đây.</p><div id="list"></div></main>
<script type="module">
import {watchAuth,getProfile,watchMembers,adminUploadMemberPhoto} from "./app.js";
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
watchAuth(async u=>{if(!u)return location.href="login.html";const me=await getProfile(u.uid);if(!me||!["admin","superadmin"].includes(me.role))return location.href="index.html";
watchMembers(items=>{const members=items.filter(x=>x.role==="member").slice(0,42);list.innerHTML=members.map((m,i)=>`<article class="member-admin-card"><img src="${m.photoUrl||m.avatarUrl||"images/lopb3.jpg"}"><div><b>${esc(m.name||("Thành viên "+(i+1)))}</b><div class="muted">${esc(m.email||"")} · ${esc(m.className||"B3")}</div><small>UID: ${esc(m.uid||m.id)}</small></div><label class="btn primary">Thay ảnh<input type="file" accept="image/*" data-uid="${esc(m.uid||m.id)}"></label></article>`).join("");
document.querySelectorAll("input[data-uid]").forEach(inp=>inp.onchange=async e=>{try{const f=e.target.files[0];if(!f)return;await adminUploadMemberPhoto(f,inp.dataset.uid,f.name);alert("Đã thay ảnh trực tiếp.");}catch(err){alert(err.message)}});});
});
</script></body></html>
